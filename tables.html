<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            font-family: 'Gill Sans', sans-serif;
        }

        table {
            width: 63%;
            border: 1px solid black;
            margin: auto;
            border-collapse: collapse;
            /*merge borders*/
        }

        th {
            color: #460e0e;
            border: 1px solid black;
            padding: 12px 6px;
            text-align: left;
            background-color: #686767;
        }

        td {
            color: #160202;
            border: 1px solid black;
            padding: 12px 6px;
            text-align: left;
        }


        .salary{
            color: #0f4b0f;
            font-weight: bold;
        }


        /* CSS Frameworks -- Bootstrap*/
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Jane</td>
                <td>Mwangi</td>
                <td>Nairobi</td>
                <td>21</td>
                <td class="salary">60,000</td>
            </tr>
            <tr>
                <td>Jack</td>
                <td>Juma</td>
                <td>Mombasa</td>
                <td>24</td>
                <td class="salary">40,000</td>
            </tr>
            <tr>
                <td>Jill</td>
                <td>Wanjiku</td>
                <td>Kisumu</td>
                <td>22</td>
                <td class="salary">50,000</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Otieno</td>
                <td>Nakuru</td>
                <td>23</td>
                <td class="salary">70,000</td>
            </tr>
            <tr>
                <td>James</td>
                <td>Kamau</td>
                <td>Eldoret</td>
                <td>25</td>
                <td class="salary">80,000</td>
            </tr>
        </tbody>

    </table>

    <!-- List Unordered-->
    <ul>
        <li>Nairobi</li>
        <li>Mombasa</li>
        <li>Nyeri</li>
        <li>Kisumu</li>
        <li>Eldoret</li>
    </ul>


</body>

</html>
